<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BEC Fleet Management</title>
<style>
  body{margin:0;background:#F4F6FA;font:13px/1.5 Verdana,Geneva,sans-serif;color:#0E1B33}
  .bar{background:#002664;color:#fff;padding:20px 16px}
  .bar b{font-size:20px}
  .msg{max-width:640px;margin:40px auto;padding:0 16px;color:#5D6573}
  .err{color:#B4232F}
</style>
</head>
<body>
<div class="bar"><b>Fleet Management</b></div>
<div class="msg" id="msg">Loading dashboard…</div>
<script>
/* Loader only. The dashboard itself lives in Code.gs (Apps Script).
   Update Code.gs and redeploy as a new version; this file never needs to change. */
(function(){
var EXEC = "https://script.google.com/macros/s/AKfycbz2Edk0xhgNv29vUpHCSL9Y7QpU06f5XZFs6yMSX5vDXCflJwZd5RFTBYGd7axkWast/exec";
fetch(EXEC + "?action=ui&api=" + encodeURIComponent(EXEC) + "&t=" + Date.now())
  .then(r => r.text())
  .then(html => {
    if (!/Fleet Management/.test(html)) throw new Error(html.slice(0, 200));
    document.open(); document.write(html); document.close();
  })
  .catch(err => {
    const m = document.getElementById("msg");
    m.className = "msg err";
    m.textContent = "Cannot load the dashboard from Google Apps Script. Open the script's /exec?action=ping link in your browser. If it asks you to sign in or shows an error, redeploy with 'Who has access: Anyone' and authorise the script. (" + err.message + ")";
  });
})();
</script>
</body>
</html>
